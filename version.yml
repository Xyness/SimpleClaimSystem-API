# Version
version: 2.7.0

# Update date
date: 03/08/2026

# Update notes
update-notes:
- "Fixed a duplication exploit when a stacked pile was picked up with a full inventory"
- "Stacked amounts are stored on the item itself and every pickup moves an exact amount"
- "Fixed items being duplicated when a mob took them from a stacked pile (piglins, allays)"
- "Fixed banned players entering a claim by walking or flying backwards"
- "Added the CREATE_PORTAL permission, a portal opened by a traveller is checked in the destination claim"
- "Added the IGNITE_PORTAL permission, candles and campfires use INTERACT_CANDLE and INTERACT_CAMPFIRE"
- "Fixed FIRE_IGNITE blocking players from lighting portals, candles and campfires with no message"
- "FIRE_IGNITE only covers natural causes now (lava, lightning, fire spread, dispensers)"
- "Fixed beds doing nothing in the Nether and the End when BED_EXPLOSIONS was disabled"
- "Fixed sculk spreading in a claim with SCULK_SPREAD disabled by dying next to a catalyst"
- "Added max-chunks-cap and max-claims-cap to limit how far vote rewards can raise a limit"
- "Added max-chunks-per-claim and scs.limit.chunks-per-claim.<n> to limit the size of one claim"
- "Added allow-player-claims per world, /parea and free building outside claims still work"
- "Fixed the Oraxen hook failing on recent Oraxen versions"
- "Added the missing denial messages for crafters and beacon effects"
