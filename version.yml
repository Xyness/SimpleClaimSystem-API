# Update notes
update-notes:
- "Added a hooks section in config.yml, any integration can be disabled with one flag"
- "Added bedrock.force-java-menus, Bedrock players get the Java chest menus translated by Geyser"
- "Bedrock menus are customizable through bedrock-guis/*.yml, one file per menu"
- "The 16 Bedrock menu titles, buttons and icons can be changed without touching the jar"
- "menu_flags.yml and menu_permissions.yml accept per flag and per permission text overrides"
