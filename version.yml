# Version
version: 2.3.4

# Update date
date: 27/04/2026

# Update notes
update-notes:
- "Auto-naming with %n picks the lowest free number per player, gaps from deleted claims are reused"
- "Most claim events are cancellable now, create, delete, chunk, member, rename, flags, sale and transfer"
- "Claim getters return read only views, mutate through addMember(), setFlag() or the API"
- "Web dashboard tokens are stored hashed, existing tokens migrate on first load"
- "Every dashboard action is logged with the admin UUID and IP"
- "The dashboard warns at boot when cors-origins contains a wildcard"
- "The audit log flushes every 5 seconds, configurable (audit-logs.flush-interval-seconds and batch-size)"
- "Fixed the Folia teleport packet handler reading player state from the wrong thread"
- "auto-claim, auto-merge and auto-delchunk reject claim names with unsafe characters"
- "Connection leak detection is on by default (database.hikari.leak-detection-ms)"
- "Cached data for offline players is dropped every 10 minutes"
- "Fixed a race when two players saved a template with the same name at the same instant"
- "Fixed PlayerInteract firing twice on right click"
- "Added the scs_schema_version table for future migrations"
- "Schema migrations refuse table names outside the plugin whitelist"
