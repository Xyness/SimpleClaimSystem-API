# Version
version: 2.6.0

# Update date
date: 15/06/2026

# Update notes
update-notes:
- "Added chunk cost modes, exponential, linear or fixed (claims.economy.cost-mode)"
- "Added named Discord webhooks, each event goes to the ones you choose"
- "Added claim spawn holograms, a floating info panel with placeholders and conditional lines"
- "Claim borders can briefly appear when you enter a claim, coloured by ownership"
- "Auto-map can display as a live scoreboard sidebar (claims.auto-map.display)"
- "The claim settings menu handles the sale, the visit price, the hologram, the icon and role creation"
- "Added a configurable prefix on every chat message, empty to disable it"
- "Fixed being able to list a claim for sale while the economy is disabled"
- "Fixed /claim kick not removing the player from the claim"
- "Fixed claims not showing on Pl3xMap, dynmap, BlueMap and squaremap until a /scs reload"
- "Fixed PlaceholderAPI placeholders staying dead until a /scs reload after an update"
- "Fixed /scs resetAllPlayerSettings leaving the plugin stuck in maintenance mode"
- "Fixed packetevents never being initialised, which broke teleport detection and holograms"
- "Newly claimed land is protected instantly, with no window where it reads as unclaimed"
- "Fixed a Redis crash on claims with expired bans, and a possible player data stall"
- "Lighter Redis bulk writes and claim particles"
